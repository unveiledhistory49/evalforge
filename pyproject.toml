[project]
name = "evalforge"
version = "1.0.0"
description = "Reproducible ML evaluation framework: pinned seeds, content-hashed datasets, digest-verified runs, statistical comparison, CI gates. No torch required."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["ruff>=0.16.5", "mypy>=1.11", "pytest>=8"]
[project.scripts]
evalforge = "evalforge.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C90"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests exercise determinism itself; stdlib random there is the subject, not a secret.
"tests/*" = ["S311"]
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
